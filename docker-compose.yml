services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clena
      POSTGRES_PASSWORD: clena
      POSTGRES_DB: clena
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clena -d clena']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
