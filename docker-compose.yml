
services:
  postgres:
    image: postgres:15
    container_name: clena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?Define environment variables in .env}
      POSTGRES_USER: ${DATABASE_USER:?Define environment variables in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Define environment variables in .env}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: