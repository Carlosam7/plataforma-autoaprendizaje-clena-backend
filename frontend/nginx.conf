# Frontend de Kamá en Docker. El frontend llama a la API con la ruta relativa /api/v1,
# así que nginx la reenvía al servicio backend: el navegador ve un solo origen y la cookie
# del refresh token (SameSite=Strict, path /api/v1/auth) funciona sin CORS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker. Con la variable, nginx resuelve "backend" en cada petición:
    # si el contenedor del backend se recrea y cambia de IP, el proxy no se queda con la vieja.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:3000;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rutas de React Router (/guias/smishing, enlaces de los QR): si no es un archivo,
    # se entrega index.html y el router del navegador decide qué pantalla mostrar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
