name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clena
          POSTGRES_PASSWORD: clena
          POSTGRES_DB: clena
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clena -d clena"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://clena:clena@localhost:5432/clena?schema=public
      JWT_ACCESS_SECRET: secreto-solo-para-ci-con-mas-de-32-caracteres
      AVISO_PRIVACIDAD_VERSION: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: backend
        run: pnpm lint

      - name: Unit tests with coverage
        working-directory: backend
        run: pnpm test:cov

      - name: E2E tests
        working-directory: backend
        run: pnpm test:e2e

      - name: Build
        working-directory: backend
        run: pnpm build
